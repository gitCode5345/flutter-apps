    sdk: flutter
  go_router: ^16.2.2
  http: ^1.5.0
  popover: ^0.4.0
  shared_preferences: ^2.2.3

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  mockito: ^5.5.1
  build_runner: ^2.10.2
